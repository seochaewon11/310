<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 기억력 매칭 게임</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{noto:['Noto Sans KR','sans-serif']},boxShadow:{'card':'4px 4px 0px 0px rgba(0,0,0,0.12)','card-sm':'3px 3px 0px 0px rgba(0,0,0,0.09)','btn':'4px 4px 0px 0px rgba(0,0,0,0.18)','score':'5px 5px 0px 0px rgba(0,0,0,0.10)'},borderRadius:{xl2:'18px'},keyframes:{pop:{'0%,100%':{transform:'scale(1)'},'50%':{transform:'scale(1.18)'}},fadein:{from:{opacity:'0',transform:'translateY(8px)'},to:{opacity:'1',transform:'none'}}},animation:{pop:'pop 0.35s ease',fadein:'fadein 0.4s ease'}}}}
</script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;margin:0;background:#FFF9F0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card-flip{transition:transform 0.38s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
  .card-wrap.flipped .card-flip,.card-wrap.matched .card-flip{transform:rotateY(180deg)}
  .card-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0}
  .card-front{transform:rotateY(180deg)}
  .card-wrap.matched .card-emoji{animation:pop 0.35s ease}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>

<!-- 배경 장식 점들 -->
<div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
  <div class="absolute top-6 left-6 w-4 h-4 rounded-full bg-pink-300 opacity-40"></div>
  <div class="absolute top-14 right-10 w-3 h-3 rounded-full bg-sky-300 opacity-40"></div>
  <div class="absolute bottom-10 left-14 w-5 h-5 rounded-full bg-emerald-300 opacity-35"></div>
  <div class="absolute bottom-6 right-6 w-4 h-4 rounded-full bg-yellow-300 opacity-40"></div>
  <div class="absolute top-1/2 left-3 w-3 h-3 rounded-full bg-purple-300 opacity-35"></div>
  <div class="absolute top-1/3 right-4 w-4 h-4 rounded-full bg-orange-300 opacity-35"></div>
</div>

<div class="relative w-full max-w-2xl">

  <!-- 헤더 -->
  <div class="bg-[#6C63FF] border-2 border-[#3D35CC] rounded-xl2 shadow-card px-5 py-3 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="text-2xl leading-none">🧠</span>
      <div>
        <div class="text-white font-black text-lg leading-tight">기억력 매칭 게임</div>
        <div class="text-[#C8C4FF] text-xs font-bold">카드를 뒤집어 짝을 맞춰요!</div>
      </div>
    </div>
    <div class="flex gap-2">
      <div class="bg-white/20 border border-white/40 rounded-xl px-3 py-1 text-white text-xs font-black" id="tries-chip">시도 0</div>
      <div class="bg-white/20 border border-white/40 rounded-xl px-3 py-1 text-white text-xs font-black" id="match-chip">0 / 6 ✓</div>
    </div>
  </div>

  <div class="flex gap-3 items-start">

    <!-- 게임판 -->
    <div class="flex-1 flex flex-col gap-3">
      <div id="board" class="grid grid-cols-4 gap-2.5"></div>

      <!-- 완료 배너 -->
      <div id="win-banner" class="hidden animate-fadein bg-[#FFD54F] border-2 border-[#E65100] rounded-xl2 shadow-card px-4 py-2.5 text-center text-[#BF360C] font-black text-base">
        🎉 모두 맞췄어요! 정말 잘했어요! 🎊
      </div>

      <!-- 버튼 -->
      <div class="flex gap-2.5">
        <button onclick="initGame()"
          class="flex-1 bg-[#FF6B81] border-2 border-[#C0392B] rounded-xl2 shadow-btn text-white font-black text-sm py-2.5 active:translate-y-0.5 active:shadow-none transition-all hover:brightness-105">
          🔄 새 게임
        </button>
        <button onclick="revealAll()"
          class="flex-1 bg-[#48DBFB] border-2 border-[#0097A7] rounded-xl2 shadow-btn text-[#006064] font-black text-sm py-2.5 active:translate-y-0.5 active:shadow-none transition-all hover:brightness-105">
          👁️ 힌트 보기
        </button>
      </div>
    </div>

    <!-- 점수판 -->
    <div class="w-[182px] shrink-0">
      <div class="bg-[#FFFDE7] border-2 border-[#FFD54F] rounded-xl2 shadow-score p-3.5">
        <div class="text-center font-black text-[#E65100] text-sm mb-2.5">🏆 모둠 점수판</div>
        <div id="score-list" class="flex flex-col gap-1.5"></div>
        <button onclick="resetScores()"
          class="mt-2.5 w-full bg-white border-2 border-[#E0E0E0] rounded-xl shadow-card-sm text-[#757575] font-bold text-xs py-1.5 active:translate-y-0.5 active:shadow-none transition-all hover:bg-gray-50">
          🗑️ 점수 초기화
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const PAIRS   = ['🦊','🐸','🌈','⭐','🍕','🎈'];
const TEAM_BG = ['#FFCDD2','#FFE0B2','#FFF9C4','#C8E6C9','#BBDEFB','#E1BEE7'];
const TEAM_BD = ['#E57373','#FFB74D','#FFF176','#81C784','#64B5F6','#CE93D8'];
const TEAM_TX = ['#B71C1C','#E65100','#827717','#1B5E20','#0D47A1','#4A148C'];
const NAMES   = ['1조','2조','3조','4조','5조','6조'];

let cards=[], flipped=[], matched=0, tries=0, busy=false;
let scores=[0,0,0,0,0,0];

function initGame(){
  let deck=[...PAIRS,...PAIRS];
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  cards=deck; flipped=[]; matched=0; tries=0; busy=false;
  document.getElementById('win-banner').classList.add('hidden');
  updateStats(); renderBoard();
}

function renderBoard(){
  const b=document.getElementById('board'); b.innerHTML='';
  cards.forEach((em,i)=>{
    const w=document.createElement('div');
    w.className='card-wrap cursor-pointer select-none';
    w.style.cssText='position:relative';
    w.innerHTML=`
      <div class="card-flip w-full" style="aspect-ratio:1;position:relative;">
        <div class="card-face bg-[#6C63FF] border-2 border-[#3D35CC] rounded-xl2 shadow-card flex items-center justify-center text-2xl">⭐</div>
        <div class="card-face card-front rounded-xl2 shadow-card border-2 border-[#E0D4FF] bg-white flex items-center justify-center">
          <span class="card-emoji text-3xl leading-none">${em}</span>
        </div>
      </div>`;
    w.addEventListener('click',()=>flip(w,i));
    b.appendChild(w);
  });
}

function flip(el,i){
  if(busy||el.classList.contains('flipped')||el.classList.contains('matched')||flipped.length>=2) return;
  el.classList.add('flipped'); flipped.push({el,i});
  if(flipped.length===2){
    tries++; busy=true; updateStats();
    const [a,b]=flipped;
    if(cards[a.i]===cards[b.i]){
      setTimeout(()=>{
        [a.el,b.el].forEach(e=>{
          e.classList.add('matched');
          const front=e.querySelector('.card-front');
          front.style.background='#E8F5E9';
          front.style.borderColor='#66BB6A';
        });
        flipped=[]; matched++; busy=false; updateStats();
        if(matched===6) setTimeout(()=>document.getElementById('win-banner').classList.remove('hidden'),300);
      },380);
    } else {
      setTimeout(()=>{
        a.el.classList.remove('flipped');
        b.el.classList.remove('flipped');
        flipped=[]; busy=false;
      },860);
    }
  }
}

function updateStats(){
  document.getElementById('tries-chip').textContent=`시도 ${tries}`;
  document.getElementById('match-chip').textContent=`${matched} / 6 ✓`;
}

function revealAll(){
  if(busy) return;
  document.querySelectorAll('.card-wrap').forEach(c=>c.classList.add('flipped'));
  busy=true;
  setTimeout(()=>{
    document.querySelectorAll('.card-wrap').forEach(c=>{
      if(!c.classList.contains('matched')) c.classList.remove('flipped');
    });
    busy=false;
  },1500);
}

function renderScores(){
  const l=document.getElementById('score-list'); l.innerHTML='';
  NAMES.forEach((name,i)=>{
    const row=document.createElement('div');
    row.style.cssText=`display:flex;align-items:center;gap:5px;background:${TEAM_BG[i]};border:2px solid ${TEAM_BD[i]};border-radius:11px;padding:5px 7px;box-shadow:3px 3px 0 rgba(0,0,0,0.09)`;
    row.innerHTML=`
      <div style="width:33px;flex-shrink:0;background:${TEAM_BD[i]};border-radius:7px;padding:2px 0;text-align:center;font-size:11px;font-weight:900;color:${TEAM_TX[i]}">${name}</div>
      <input id="sc-${i}" type="number" min="0" value="${scores[i]}"
        style="flex:1;min-width:0;border:none;background:transparent;font-size:20px;font-weight:900;color:${TEAM_TX[i]};text-align:center;outline:none;width:0;font-family:inherit"
        onchange="scores[${i}]=Math.max(0,parseInt(this.value)||0);this.value=scores[${i}]">
      <div style="display:flex;flex-direction:column;gap:2px">
        <button onclick="add(${i},1)"  style="width:20px;height:20px;background:white;border:1.5px solid ${TEAM_BD[i]};border-radius:5px;font-size:12px;font-weight:900;color:${TEAM_TX[i]};cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">＋</button>
        <button onclick="add(${i},-1)" style="width:20px;height:20px;background:white;border:1.5px solid ${TEAM_BD[i]};border-radius:5px;font-size:12px;font-weight:900;color:${TEAM_TX[i]};cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">－</button>
      </div>`;
    l.appendChild(row);
  });
}

function add(i,d){ scores[i]=Math.max(0,scores[i]+d); document.getElementById('sc-'+i).value=scores[i]; }

function resetScores(){
  if(!confirm('점수를 모두 초기화할까요?')) return;
  scores=[0,0,0,0,0,0]; renderScores();
}

initGame(); renderScores();
</script>
</body>
</html>
